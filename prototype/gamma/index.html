<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f73df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ガンマ計算" />
    <meta
      name="description"
      content="体重、成分量、希釈総量、速度または投与量から投与速度や目標投与量を相互に計算するガンマ計算ツール"
    />
    <title>ガンマ計算</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <h1>γ計算</h1>
          <p class="eyebrow">薬剤持続投与の指標</p>
        </div>
      </div>
    </header>

    <main class="app-shell">
      <section class="hero-card">
        <div class="weight-panel">
          <label class="field-label" for="bodyWeight">体重</label>
          <div class="input-with-unit">
            <input id="bodyWeight" type="text" inputmode="decimal" placeholder="50" />
            <span>kg</span>
          </div>
        </div>
      </section>

      <section class="board-card">
        <div class="board-header">
          <h2>薬剤設定</h2>
          <button id="addDrugButton" class="primary-button" type="button">薬剤を追加</button>
        </div>
        <div id="drugCards" class="drug-card-list"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
